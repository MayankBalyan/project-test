<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Istel</title>
    <meta name="description" content="Habits, streaks, a focus timer and an island that grows as you do." />
    <!-- Installable app (Chrome, Edge, Android): see public/manifest.webmanifest and public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#E8E7E3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Istel" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #e8e7e3;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0e0e0e;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // Keep Chrome's install prompt until the app is ready to offer it (src/lib/pwa.web.ts).
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__istelInstallPrompt = e;
      });
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Istel.</noscript>
    <div id="root"></div>
  </body>
</html>
